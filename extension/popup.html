<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Try-On Settings</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #2c3e50;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .upload-section {
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: white;
      cursor: pointer;
      transition: border-color 0.3s;
    }
    .upload-section:hover {
      border-color: #3498db;
    }
    .preview-container {
      width: 100%;
      height: 200px;
      background-color: #eee;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .preview-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
      display: none;
    }
    .placeholder-text {
      color: #999;
      font-size: 14px;
    }
    button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #2980b9;
    }
    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
    }
    #status {
      text-align: center;
      font-size: 12px;
      margin-top: 5px;
      min-height: 1.2em;
    }
    .success { color: #27ae60; }
    .error { color: #e74c3c; }
  </style>
</head>
<body>
  <h2>Virtual Try-On Settings</h2>
  <div class="container">
    <div class="upload-section" id="uploadArea">
      <p>Click to upload your full-body photo</p>
      <input type="file" id="fileInput" accept="image/*" style="display: none;">
    </div>
    
    <div class="preview-container">
      <span class="placeholder-text">No image uploaded</span>
      <img id="preview" class="preview-image" alt="Your photo">
    </div>

    <button id="saveBtn" disabled>Save Photo</button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
